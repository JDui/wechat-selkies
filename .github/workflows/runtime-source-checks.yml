name: Runtime Source Checks

on:
  push:
    branches: [AXiVer]
    paths:
      - "root/scripts/**"
      - "root/lsiopy/lib/python3.12/site-packages/selkies/**"
      - "root/etc/s6-overlay/s6-rc.d/**"
      - "root/defaults/default.conf"
      - "Dockerfile"
  pull_request:
    paths:
      - "root/scripts/**"
      - "root/lsiopy/lib/python3.12/site-packages/selkies/**"
      - "root/etc/s6-overlay/s6-rc.d/**"
      - "root/defaults/default.conf"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile modified Python runtime
        run: |
          python -m compileall -q \
            root/scripts/container_download.py \
            root/scripts/session_auth_bridge.py \
            root/lsiopy/lib/python3.12/site-packages/selkies/selkies.py \
            root/lsiopy/lib/python3.12/site-packages/selkies/input_handler.py \
            root/lsiopy/lib/python3.12/site-packages/selkies/rust_native.py
      - name: Validate shell scripts
        run: |
          bash -n root/scripts/start.sh
          bash -n root/etc/s6-overlay/s6-rc.d/init-nginx/run
          bash -n root/etc/s6-overlay/s6-rc.d/svc-runtime-sidecar/run
