<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXIVER Client</title>
    <link rel="stylesheet" href="./waiting.css" />
  </head>
  <body>
    <main class="brand">
      <img class="logo" src="./brand-mark.svg" width="72" height="72" alt="" aria-hidden="true" />
      <strong>AXIVER</strong>
      <span id="hint">正在准备远程会话…</span>
      <div class="spinner" role="progressbar" aria-label="正在连接"></div>
    </main>
    <noscript>
      <p class="hint-noscript">此页面无需 JavaScript。若长时间停留在此页，请打开“AXIVER 控制面板”查看连接状态。</p>
    </noscript>
  </body>
</html>
