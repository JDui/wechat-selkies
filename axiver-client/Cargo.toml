[package]
name = "axiver-client"
version = "0.2.1"
description = "Portable AXIVER desktop client with LAN discovery and WAN fallback (local shell rebuild)"
authors = ["AXIVER"]
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[lib]
name = "axiver_client"
path = "src/lib.rs"

[[bin]]
name = "axiver-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
if-addrs = "0.15"
mdns-sd = "0.20"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
url = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
rfd = { version = "0.16", default-features = false }
windows = { version = "0.61", features = ["Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
