server {
  listen 3000 default_server;
  listen [::]:3000 default_server;

  location = PW_PREFIXauth/_pin_page {
    internal;
    add_header Cache-Control "no-store";
    root /usr/share/selkies/www;
    try_files /password-login.html =404;
  }

  location = PW_PREFIXauth/_check {
    internal;
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        X-Original-URI $request_uri;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass              http://127.0.0.1:CAUTH/check;
  }

  location = PW_PREFIXauth/pin {
    proxy_set_header        X-PIN $http_x_pin;
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass              http://127.0.0.1:CAUTH/pin;
  }

  location = PW_PREFIXauth/logout {
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass              http://127.0.0.1:CAUTH/logout;
  }

  location = PW_PREFIXauth/session {
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass              http://127.0.0.1:CAUTH/session;
  }

  location = SUBFOLDERupload-api/v1/token {
    auth_request PW_PREFIXauth/_check;
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        X-Original-URI $request_uri;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass              http://127.0.0.1:CAUTH/upload-token;
  }

  location = SUBFOLDERapi/upload-diagnostics {
    auth_request PW_PREFIXauth/_check;
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        X-Original-URI $request_uri;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size    64k;
    proxy_pass              http://127.0.0.1:CAUTH/diagnostics;
  }

  location SUBFOLDERupload-api/v1/ {
    auth_request PW_PREFIXauth/_check;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   10s;
    proxy_request_buffering off;
    proxy_buffering         off;
    client_max_body_size    64m;
    proxy_pass              http://127.0.0.1:CUPLOAD/upload-api/v1/;
  }

  location SUBFOLDER {
    auth_request PW_PREFIXauth/_check;
    error_page 418 =200 PW_PREFIXauth/_pin_page;
    error_page 401 403 =200 PW_PREFIXauth/_pin_page;
    alias /usr/share/selkies/web/;
    index  index.html index.htm;
    try_files $uri $uri/ =404;
  }
  location /devmode {
    auth_request PW_PREFIXauth/_check;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    client_max_body_size    10M;
    proxy_pass              http://127.0.0.1:5173;
  }
  location SUBFOLDERwebsocket {
    auth_request PW_PREFIXauth/_check;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    client_max_body_size    10M;
    proxy_pass              http://127.0.0.1:CWS;
  }
  location SUBFOLDERapi/local-link/ {
    auth_request PW_PREFIXauth/_check;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      30s;
    proxy_send_timeout      30s;
    proxy_connect_timeout   5s;
    proxy_buffering         off;
    proxy_pass              http://127.0.0.1:CLINK/;
  }
  location SUBFOLDERapi/notifications/ {
    auth_request PW_PREFIXauth/_check;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      30s;
    proxy_send_timeout      30s;
    proxy_connect_timeout   5s;
    proxy_buffering         off;
    proxy_pass              http://127.0.0.1:CNOTIFY/;
  }
  location = SUBFOLDERapi/container-sleep/status {
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      10s;
    proxy_send_timeout      10s;
    proxy_connect_timeout   3s;
    proxy_buffering         off;
    proxy_pass              http://127.0.0.1:CSLEEP/status;
  }
  location SUBFOLDERapi/container-sleep/ {
    auth_request PW_PREFIXauth/_check;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      30s;
    proxy_send_timeout      30s;
    proxy_connect_timeout   5s;
    proxy_buffering         off;
    proxy_pass              http://127.0.0.1:CSLEEP/;
  }
  location SUBFOLDERfiles {
    auth_request PW_PREFIXauth/_check;
    fancyindex on;
    fancyindex_footer SUBFOLDERnginx/footer.html;
    fancyindex_header SUBFOLDERnginx/header.html;
    alias REPLACE_DOWNLOADS_PATH/;
    if (-f $request_filename) {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }
  }
  error_page 500 502 503 504 /50x.html;
  location = SUBFOLDER50x.html {
    root /usr/share/selkies/web/;
  }
}

