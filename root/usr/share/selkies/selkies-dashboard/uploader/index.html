<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文件上传</title>
  <link rel="stylesheet" href="uploader.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">AXi-SNS-Box</p>
        <h1>文件上传</h1>
        <p class="subtitle">独立 HTTP 上传，不占用远程桌面数据通道</p>
      </div>
      <div id="service-status" class="service-status">正在检查服务…</div>
    </header>

    <section id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="选择或拖放文件">
      <input id="file-input" type="file" multiple hidden>
      <div class="drop-icon">⇧</div>
      <strong>拖放文件到这里</strong>
      <span>或点击选择文件；上传窗口可独立暂停和关闭</span>
    </section>

    <section class="toolbar">
      <span id="queue-summary">队列为空</span>
      <button id="retry-all" type="button">重试失败项</button>
      <button id="clear-finished" type="button">清除已完成</button>
    </section>

    <section id="resume-hint" class="resume-hint" hidden>
      检测到未完成任务。重新选择同名、同大小文件后会从服务器已确认的分片继续。
    </section>

    <section id="task-list" class="task-list" aria-live="polite"></section>
  </main>

  <template id="task-template">
    <article class="task">
      <div class="task-head">
        <div class="task-name"></div>
        <div class="task-status"></div>
      </div>
      <div class="task-meta"></div>
      <div class="progress"><div class="progress-bar"></div></div>
      <div class="task-actions">
        <button data-action="pause" type="button">暂停</button>
        <button data-action="resume" type="button">继续</button>
        <button data-action="retry" type="button">重试</button>
        <button data-action="cancel" type="button" class="danger">取消</button>
      </div>
    </article>
  </template>

  <script src="uploader.js"></script>
</body>
</html>
