---
services:
  wechat-selkies:
    build:
      context: .
    image: wechat-selkies:latest
    container_name: wechat-selkies
    init: true
    volumes:
      - ./config:/config
    devices:
      - /dev/dri:/dev/dri # optional, for hardware acceleration
    ports:
      - "3000:3000"       # http port
      - "3001:3001"       # https port
    restart: unless-stopped
    stop_grace_period: 1m
    mem_reservation: "2g" # reduce OOM risk during long-running idle sessions
    mem_limit: "8g"       # NAS has sufficient memory; avoid desktop/encoder reclaim stalls
    pids_limit: 4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    healthcheck:
      test: ["CMD-SHELL", "/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - PUID=1000         # set user id according to your system
      - PGID=100          # set group id according to your system
      - PROCESS_WATCHDOG=true
      - WATCHDOG_INTERVAL=10
      - WATCHDOG_TRAY=false
      - WATCHDOG_RESTART_WECHAT=true
      - WATCHDOG_RESTART_QQ=true
      - WATCHDOG_AUDIO=true
      - NOTIFICATION_BRIDGE_LOG_MAX_BYTES=2097152
      - X11_WATCHDOG=true
      - X11_WATCHDOG_FAIL_THRESHOLD=6
      - X11_HEALTHCHECK_TIMEOUT=4
      - SELKIES_SESSION_MODE=pin-takeover
      - SELKIES_SESSION_STATE_PATH=/run/selkies-active-session.json
      - SELKIES_SESSION_AUTH_PORT=38082
      - SELKIES_CONTAINER_SLEEP=true
      - SELKIES_CONTAINER_SLEEP_REQUIRE_PIN=true
      - SELKIES_CONTAINER_SLEEP_PORT=38083
      - SELKIES_CONTAINER_SLEEP_IDLE_SECONDS=180
      - SELKIES_CONTAINER_SLEEP_STARTUP_GRACE_SECONDS=180
      - CUSTOM_WS_PORT=8081
      - QQ_EXTRA_FLAGS=--disable-renderer-backgrounding --disable-backgrounding-occluded-windows --disable-gpu --disable-gpu-compositing --disable-gpu-rasterization --disable-features=CalculateNativeWinOcclusion,UseSkiaRenderer
      - SELKIES_ADAPTIVE_SLEEP_IDLE_SECONDS=3600
      - SELKIES_ADAPTIVE_SLEEP_CHECK_SECONDS=5
      - QQ_NICE_LEVEL=-2
      - QQ_WATCHDOG_HANG_DETECT=true
      - QQ_WATCHDOG_FAIL_THRESHOLD=3
      - QQ_WATCHDOG_X11_PING=true
      - QQ_WATCHDOG_X11_TIMEOUT=2
      - DRI_NODE=/dev/dri/renderD128
      - SELKIES_ENABLE_BINARY_CLIPBOARD=true
      - SELKIES_PASTE_IMAGE=true
      - SELKIES_ENCODER=x264enc,x264enc-striped,jpeg
      - SELKIES_DEFAULT_ENCODER=x264enc
      - SELKIES_DEFAULT_FRAMERATE=48
      - SELKIES_DISABLE_GAMEPAD=true
      - SELKIES_DEFAULT_BINARY_CLIPBOARD=true
      - SELKIES_DEFAULT_USE_CPU=false
      - SELKIES_DEFAULT_H264_STREAMING_MODE=true
      - SELKIES_DEFAULT_USE_PAINT_OVER_QUALITY=false
      - SELKIES_DEFAULT_H264_CRF=30
      - SELKIES_DYNAMIC_THROTTLE=true
      - SELKIES_DYNAMIC_THROTTLE_MODE=idle-low-occupancy
      - SELKIES_DYNAMIC_LOW_LATENCY_HOLD_MS=15000
      - SELKIES_DYNAMIC_LOW_LATENCY_FPS=8
      - SELKIES_DYNAMIC_LOW_LATENCY_H264_CRF=35
      - SELKIES_DYNAMIC_LOW_LATENCY_SAMPLE_PERCENT=87
      - SELKIES_STREAM_WAIT_THRESHOLD_MS=35000
      - SELKIES_STREAM_RECOVER_COOLDOWN_MS=120000
      - SELKIES_VIDEO_CORRUPTION_WATCHDOG=false
      - SELKIES_VIDEO_SOFT_RECOVER_LIMIT=2
      - SELKIES_VIDEO_RECOVER_COOLDOWN_MS=120000
      # - CUSTOM_USER=<Your Name>   # legacy field; kept for compatibility
      # - PASSWORD=<Your PIN>       # PIN-only login (no username input)
      # - SELKIES_PASTE_IMAGE_MAX_SIZE=20971520 # max image size in bytes
      # - SELKIES_PASTE_IMAGE_AUTO_PASTE=false  # disable auto Ctrl+V after write
    shm_size: "2gb"       # improves browser/desktop shared-memory headroom
